name: Isolated security CI
on:
  push:
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --audit-level=moderate
      - run: pnpm --filter storefront exec playwright install --with-deps chromium
      - name: Static export, browser and public artifact boundary
        working-directory: apps/storefront
        run: node --experimental-strip-types test/build-stage2b-fixture.mjs
      - name: Empty catalog export
        working-directory: apps/storefront
        env:
          MERCHANT_FIXTURE_EMPTY: '1'
        run: node --experimental-strip-types test/build-stage2b-fixture.mjs
