name: Deploy Storefront to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/storefront/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_TARGET: pages
      NEXT_PUBLIC_BASE_PATH: /SKUFstore
      NEXT_PUBLIC_API_URL: https://api.skufnya.com
      API_INTERNAL_URL: http://api.skufnya.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storefront
        run: pnpm --filter storefront build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./apps/storefront/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4