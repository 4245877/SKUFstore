name: Deploy Storefront to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "apps/storefront/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-storefront.yml"
  workflow_dispatch:
  schedule:
    # Reconcile new/renamed/removed public URLs without a backend token.
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  freshness:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check live catalog against published pages
        id: check
        run: node apps/storefront/scripts/catalog-freshness.mjs --reconcile

  build:
    needs: freshness
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.freshness.outputs.needs_build == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Newer pushes supersede an older build, so a queued/stuck build can never
    # block later commits from reaching Pages.
    concurrency:
      group: "pages-build-${{ github.ref }}"
      cancel-in-progress: true
    env:
      DEPLOY_TARGET: pages
      NEXT_PUBLIC_API_URL: https://api.skufnya.com
      NODE_OPTIONS: --dns-result-order=ipv4first
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Two cheap requests so a failed build can be told apart at a glance:
      # API down/slow, versus the build itself. Anything heavier here eats the
      # same 60 req/min budget the build is about to spend.
      - name: Diagnose public API
        continue-on-error: true
        run: |
          echo "DNS via system resolver:"
          getent ahostsv4 api.skufnya.com || true

          echo "API health (with timing and rate-limit budget):"
          curl --ipv4 --fail --show-error --location \
            --connect-timeout 10 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 3 \
            --dump-header - \
            --write-out 'connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n' \
            "https://api.skufnya.com/health" \
          | grep -Ei '^(x-ratelimit|retry-after|HTTP/|connect=)' || true

          echo "Catalog listing size and timing:"
          curl --ipv4 --fail --show-error --location \
            --connect-timeout 10 \
            --max-time 60 \
            --output /dev/null \
            --write-out 'status=%{http_code} total=%{time_total}s size=%{size_download}B\n' \
            "https://api.skufnya.com/api/catalog/products?page=1&limit=100" || true

      - name: Storefront regression tests
        run: pnpm --filter storefront test

      - name: Build Storefront
        run: pnpm --filter storefront build

      # The build must publish a page for every product the API called public.
      # next build already fails on a missing product, but this guard also
      # catches a page lost after rendering — a truncated catalog must never
      # reach Pages, because a silently missing product is a 404 for buyers.
      - name: Verify every published product was exported
        run: |
          SNAPSHOT=apps/storefront/.next/cache/skufnya-build/catalog-snapshot.json
          EXPECTED=$(node -e "console.log(require('./$SNAPSHOT').items.length)")
          ACTUAL=$(find apps/storefront/out/product -mindepth 1 -maxdepth 1 -type d | wc -l)

          echo "published products in snapshot: $EXPECTED"
          echo "exported product pages:         $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Exported $ACTUAL product pages but the catalog snapshot has $EXPECTED published products."
            exit 1
          fi

      - name: Verify Ukrainian routes and SEO export
        working-directory: apps/storefront
        run: node --experimental-strip-types test/verify-stage1-export.mjs

      - name: Install Chromium for catalog regression
        working-directory: apps/storefront
        run: pnpm exec playwright install --with-deps chromium

      - name: Catalog query hydration and navigation regression
        working-directory: apps/storefront
        run: |
          python3 -m http.server 54332 --bind 127.0.0.1 --directory out > /tmp/storefront-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:54332/catalog/ > /dev/null; then break; fi
            sleep 1
          done
          node test/browser-catalog-hydration.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./apps/storefront/out

  deploy:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Deployments are serialised, but an in-flight one is never cancelled.
    concurrency:
      group: "pages-deploy"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 900000
          error_count: 20

      # This reads the CURRENT API and actual published HTML, not the build snapshot.
      # Failure here means Pages was published but acceptance/freshness failed.
      - name: Verify production catalog freshness
        env:
          FRESHNESS_ATTEMPTS: "4"
        run: node apps/storefront/scripts/catalog-freshness.mjs
